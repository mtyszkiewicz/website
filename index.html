<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mtyszkiewicz.dev</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            overflow: hidden;
            background: #fefefe;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0.05;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><defs><filter id="noise"><feflood flood-color="white"/><fecomponenttransfer><fefunca type="discrete" tablevalues="0 .5 0 1 0 .8 0 .2 0 .9"/></fecomponenttransfer><fecomposite operator="over" in2="SourceGraphic"/></filter></defs><rect width="100%" height="100%" filter="url(%23noise)"/></svg>') repeat;
            animation: noise 0.2s infinite linear;
        }
        @keyframes noise {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-1px, -1px); }
            20% { transform: translate(1px, 1px); }
            30% { transform: translate(-1px, 1px); }
            40% { transform: translate(1px, -1px); }
            50% { transform: translate(-1px, -1px); }
            60% { transform: translate(1px, 1px); }
            70% { transform: translate(-1px, 1px); }
            80% { transform: translate(1px, -1px); }
            90% { transform: translate(-1px, -1px); }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="noise-overlay"></div>
    
    <script>
        // ===== CONFIGURABLE PARAMETERS =====
        const RAIN_CONFIG = {
            // Population
            DESKTOP_COUNT: 100,
            MOBILE_COUNT: 60,

            /* Drop size = how close the drop is to the camera. A shower covers a
               huge depth range, so size is sampled from a bell curve and every
               other property is derived from it. */
            SIZE_MEAN: 0.85,
            SIZE_STD_DEV: 0.32,
            SIZE_MIN: 0.35,
            SIZE_MAX: 1.5,

            /* Fall speed. Terminal velocity grows with drop size with a
               square-root falloff (v ~ sqrt(diameter), as measured on real
               raindrops), so big drops fall faster without an unrealistic
               spread. Units are pixels per 1/60 s tick. */
            TERMINAL_SPEED_MIN: 9,
            TERMINAL_SPEED_MAX: 32,
            TERMINAL_EXPONENT: 0.6,
            SPAWN_SPEED_MIN: 0.45,     // drops enter the frame at 45-80 % of
            SPAWN_SPEED_MAX: 0.80,     // terminal velocity, then settle
            RESPONSE_LARGE: 0.06,      // how quickly a heavy drop settles
            RESPONSE_SMALL: 0.16,      // light drops settle quicker

            /* Streak length = speed x exposure. A camera records the trail a
               drop covers while the shutter is open, which is why fast drops
               read as long streaks and slow ones as dashes. */
            EXPOSURE: 1.0,
            LENGTH_JITTER: 0.15,       // +-15 % individual variation
            LENGTH_MIN: 6,
            LENGTH_MAX: 46,

            /* Streak silhouette: an engraved taper, wide at the drop and drawn
               out to a point at the tail. */
            TAPER_MIN: 0.10,           // tail half-width / head half-width
            TAPER_MAX: 0.40,
            HEAD_WIDTH: 1.25,          // the drop itself is wider than its trail
            MIN_HALF_WIDTH: 0.28,      // keeps the thinnest drops visible
            SEGMENTS: 5,               // samples down each side
            CAP_SEGMENTS: 8,           // samples around the rounded head

            /* Wind. Every drop reads the same field, so the whole screen leans
               together like one weather system; gust fronts travel sideways so
               neighbours stay nearly parallel. */
            WIND_BASE: 0.45,
            WIND_GUST: 1.2,
            WIND_FREQUENCY: 0.006,     // rad per tick -> ~17 s gust cycle
            WIND_TRAVEL: 0.0025,       // rad per px -> fronts cross the page
            WIND_CATCH_LARGE: 0.55,    // heavy drops ignore most of the wind
            WIND_CATCH_SMALL: 0.95,    // light drops are carried by it
            SLANT_JITTER: 0.08,        // small per-drop individuality

            // Always-on turbulence
            WOBBLE_STRENGTH: 0.12,
            WOBBLE_SPEED_MIN: 0.02,
            WOBBLE_SPEED_MAX: 0.05,

            /* Depth of field, posterised into flat ink densities. Fewer levels
               gives a flatter, more printed look and fewer fill calls. */
            INK_LEVELS: 6,
            FAR_ALPHA: 0.30,           // distant rain is faint
            NEAR_ALPHA: 0.92,

            /* Specular highlight. The light is treated as coming from the left,
               so the highlight on every drop sits off-centre on its left side,
               the way it does on a real water column. */
            HIGHLIGHT_R: 128,
            HIGHLIGHT_G: 128,
            HIGHLIGHT_B: 128,
            HIGHLIGHT_ALPHA: 0.55,
            HIGHLIGHT_WIDTH: 0.30,     // fraction of the drop width
            HIGHLIGHT_OFFSET: 0.42,    // fraction of the local half-width
            HIGHLIGHT_START: 0.50,     // along the streak: 0 tail, 1 head
            HIGHLIGHT_END: 0.97,
            HIGHLIGHT_MIN_SIZE: 0.75,  // only drops wide enough to show it

            // Ink colour
            COLOR_R: 0,
            COLOR_G: 0,
            COLOR_B: 0,

            // Recycling
            RESET_HEIGHT_VARIATION: 260,
            SPAWN_MARGIN: 60,
        };

        // Detect mobile for optimizations
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;


        // Speed multiplier for mobile devices
        const mobileSpeedMultiplier = isMobile ? 1.4 : 1.0;

        // Respect the OS "reduce motion" setting: draw the scene, then freeze it
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const TAU = Math.PI * 2;

        // Helper function to generate random numbers with normal distribution (bell curve)
        function randomNormal(mean, stdDev) {
            // Box-Muller transform
            const u1 = 1 - Math.random(); // (0, 1], so log() is always finite
            const u2 = Math.random();
            const z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(TAU * u2);
            return z0 * stdDev + mean;
        }

        function clamp(value, min, max) {
            return value < min ? min : (value > max ? max : value);
        }

        function mix(a, b, t) {
            return a + (b - a) * t;
        }

        class RainSystem {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.rainDrops = [];
                this.time = 0;
                this.lastTimestamp = 0;
                this.accumulator = 0;
                this.timeStep = 1000 / 60; // physics is defined per 1/60 s tick

                /* Drops are bucketed by ink density before each draw, so a whole
                   shower costs a handful of fill calls instead of one draw per
                   drop. The arrays are reused to keep the GC quiet. */
                this.levels = RAIN_CONFIG.INK_LEVELS;
                this.streakBuckets = [];
                this.headBuckets = [];
                this.highlightBuckets = [];
                for (let i = 0; i < this.levels; i++) {
                    this.streakBuckets.push([]);
                    this.headBuckets.push([]);
                    this.highlightBuckets.push([]);
                }

                this.resize();
                this.init();

                /* Pre-roll the simulation so the first painted frame is an
                   already-settled shower instead of a row of freshly spawned
                   vertical dashes. */
                for (let i = 0; i < 90; i++) {
                    this.updateRain(1);
                    this.time += 1;
                }
                this.drawRain();

                if (!prefersReducedMotion) {
                    requestAnimationFrame((ts) => this.animate(ts));
                }

                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = Math.round(this.width * dpr);
                this.canvas.height = Math.round(this.height * dpr);
                // Keep drawing in CSS pixels; the backing store stays sharp.
                this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                if (this.rainDrops.length) this.drawRain();
            }

            // ---- Properties derived from a drop's size ----------------------

            // Apparent size -> 0 (far, thin) .. 1 (near, fat)
            sizeToDepth(size) {
                const c = RAIN_CONFIG;
                return clamp((size - c.SIZE_MIN) / (c.SIZE_MAX - c.SIZE_MIN), 0, 1);
            }

            // Half-width at the widest point: the drop itself, not the trail.
            headHalfWidth(drop) {
                return Math.max(RAIN_CONFIG.MIN_HALF_WIDTH, drop.size * 0.5 * RAIN_CONFIG.HEAD_WIDTH);
            }

            // Representative size of an ink level, used to scale line widths.
            sizeForLevel(level) {
                const c = RAIN_CONFIG;
                const l = this.levels > 1 ? level / (this.levels - 1) : 1;
                return mix(c.SIZE_MIN, c.SIZE_MAX, l);
            }

            levelAlpha(level) {
                const c = RAIN_CONFIG;
                const l = this.levels > 1 ? level / (this.levels - 1) : 1;
                return mix(c.FAR_ALPHA, c.NEAR_ALPHA, l);
            }

            ink(alpha) {
                const c = RAIN_CONFIG;
                return `rgba(${c.COLOR_R}, ${c.COLOR_G}, ${c.COLOR_B}, ${alpha})`;
            }

            highlightColor(level) {
                const c = RAIN_CONFIG;
                const l = this.levels > 1 ? level / (this.levels - 1) : 1;
                const alpha = c.HIGHLIGHT_ALPHA * mix(0.55, 1, l);
                return `rgba(${c.HIGHLIGHT_R}, ${c.HIGHLIGHT_G}, ${c.HIGHLIGHT_B}, ${alpha})`;
            }

            /* One shared wind field: a slow gust cycle plus fronts that travel
               sideways, so neighbouring drops lean almost the same way and the
               screen reads as a single weather system. */
            windAt(x) {
                const c = RAIN_CONFIG;
                const phase = this.time * c.WIND_FREQUENCY - x * c.WIND_TRAVEL;
                return c.WIND_BASE + c.WIND_GUST * (Math.sin(phase) * 0.72 + Math.sin(phase * 2.3 + 1.7) * 0.28);
            }

            /* Give a drop every property that follows from its size. Called at
               spawn and again whenever the drop is recycled. */
            seed(drop, initial) {
                const c = RAIN_CONFIG;

                drop.size = clamp(randomNormal(c.SIZE_MEAN, c.SIZE_STD_DEV), c.SIZE_MIN, c.SIZE_MAX);
                drop.depth = this.sizeToDepth(drop.size);

                // Terminal velocity grows with the drop, sub-linearly.
                drop.terminal = mix(
                    c.TERMINAL_SPEED_MIN,
                    c.TERMINAL_SPEED_MAX,
                    Math.pow(drop.depth, c.TERMINAL_EXPONENT)
                );

                // Heavy drops change speed slowly and barely notice the wind.
                drop.response = mix(c.RESPONSE_LARGE, c.RESPONSE_SMALL, 1 - drop.depth);
                drop.windCatch = mix(c.WIND_CATCH_LARGE, c.WIND_CATCH_SMALL, 1 - drop.depth);

                // Individual character, fixed for the lifetime of the drop so
                // nothing flickers as it falls.
                drop.taper = mix(c.TAPER_MIN, c.TAPER_MAX, Math.random());
                drop.slant = (Math.random() - 0.5) * c.SLANT_JITTER;
                drop.wobble = Math.random() * TAU;
                drop.wobbleSpeed = mix(c.WOBBLE_SPEED_MIN, c.WOBBLE_SPEED_MAX, Math.random());
                drop.jitter = 1 + (Math.random() - 0.5) * 2 * c.LENGTH_JITTER;

                // Ink density, and therefore the bucket this drop is drawn in.
                drop.level = Math.round(drop.depth * (this.levels - 1));

                // Rain has usually been falling for a while before it enters the
                // frame, so drops arrive at a good fraction of terminal speed.
                drop.vy = drop.terminal * mix(c.SPAWN_SPEED_MIN, c.SPAWN_SPEED_MAX, Math.random());
                drop.vx = 0;
                drop.dirX = 0;
                drop.dirY = 1;
                drop.length = clamp(drop.vy * c.EXPOSURE * drop.jitter, c.LENGTH_MIN, c.LENGTH_MAX);

                drop.x = Math.random() * (this.width + c.SPAWN_MARGIN * 2) - c.SPAWN_MARGIN;
                drop.y = initial
                    ? Math.random() * this.height - this.height
                    : -drop.length - Math.random() * c.RESET_HEIGHT_VARIATION;
            }

            init() {
                // Adjust count based on device capability using config
                const rainCount = isMobile ? RAIN_CONFIG.MOBILE_COUNT : RAIN_CONFIG.DESKTOP_COUNT;

                for (let i = 0; i < rainCount; i++) {
                    const drop = {};
                    this.seed(drop, true);
                    this.rainDrops.push(drop);
                }
            }

            updateRain(dt) {
                const c = RAIN_CONFIG;

                for (let i = 0; i < this.rainDrops.length; i++) {
                    const drop = this.rainDrops[i];
                    const settle = 1 - Math.exp(-drop.response * dt);

                    /* Air drag rather than a hard speed clamp: the drop settles
                       at its terminal velocity, so a newly spawned drop is
                       visibly slower (and shorter) than the same drop a second
                       later. */
                    drop.vy += (drop.terminal - drop.vy) * settle;

                    // Light drops are carried by the wind, heavy ones keep
                    // falling almost straight, plus a little turbulence.
                    const targetVx = this.windAt(drop.x) * drop.windCatch
                        + drop.slant
                        + Math.sin(drop.wobble) * c.WOBBLE_STRENGTH;
                    drop.vx += (targetVx - drop.vx) * settle;

                    drop.wobble += drop.wobbleSpeed * dt;
                    drop.x += drop.vx * dt;
                    drop.y += drop.vy * dt;

                    // The streak is the distance covered during the exposure, so
                    // it is always drawn along the true direction of travel.
                    drop.length = clamp(drop.vy * c.EXPOSURE * drop.jitter, c.LENGTH_MIN, c.LENGTH_MAX);
                    const inv = 1 / Math.hypot(drop.vx, drop.vy);
                    drop.dirX = drop.vx * inv;
                    drop.dirY = drop.vy * inv;

                    // Recycle once the whole streak has left the frame.
                    if (drop.y - drop.length > this.height) {
                        this.seed(drop, false);
                        continue;
                    }

                    // Keep drifting drops inside the field instead of losing them.
                    const margin = drop.length + c.SPAWN_MARGIN;
                    const span = this.width + margin * 2;
                    if (drop.x > this.width + margin) {
                        drop.x -= span;
                    } else if (drop.x < -margin) {
                        drop.x += span;
                    }
                }
            }

            /* Trace one tapered silhouette: a point at the tail, widening to the
               drop at the head, closed with a rounded cap. Straight, because a
               trail recorded in a single instant really is straight. */
            traceStreak(ctx, drop) {
                const c = RAIN_CONFIG;
                const len = drop.length;
                const dirX = drop.dirX;
                const dirY = drop.dirY;
                const perpX = -dirY;   // left of travel
                const perpY = dirX;
                const tailX = drop.x - dirX * len;
                const tailY = drop.y - dirY * len;
                const wHead = this.headHalfWidth(drop);
                const wTail = wHead * drop.taper;

                // One side, tail -> head.
                for (let i = 0; i <= c.SEGMENTS; i++) {
                    const t = i / c.SEGMENTS;
                    const w = wTail + (wHead - wTail) * Math.pow(t, 0.7);
                    const x = tailX + dirX * len * t + perpX * w;
                    const y = tailY + dirY * len * t + perpY * w;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }

                // Round the head: sweep from one side to the other through the
                // point of travel, where the drop itself sits.
                for (let i = 1; i < c.CAP_SEGMENTS; i++) {
                    const phi = Math.PI * (i / c.CAP_SEGMENTS);
                    const cos = Math.cos(phi);
                    const sin = Math.sin(phi);
                    ctx.lineTo(
                        drop.x + (perpX * cos + dirX * sin) * wHead,
                        drop.y + (perpY * cos + dirY * sin) * wHead
                    );
                }

                // Back down the other side.
                for (let i = c.SEGMENTS; i >= 0; i--) {
                    const t = i / c.SEGMENTS;
                    const w = wTail + (wHead - wTail) * Math.pow(t, 0.7);
                    ctx.lineTo(
                        tailX + dirX * len * t - perpX * w,
                        tailY + dirY * len * t - perpY * w
                    );
                }

                ctx.closePath();
            }

            // Specular highlight: off-centre, on the lit side of the column.
            traceHighlight(ctx, drop) {
                const c = RAIN_CONFIG;
                const len = drop.length;
                const offset = this.headHalfWidth(drop) * c.HIGHLIGHT_OFFSET;
                const ox = -drop.dirY * offset;
                const oy = drop.dirX * offset;

                for (let i = 0; i < 2; i++) {
                    const t = i === 0 ? c.HIGHLIGHT_START : c.HIGHLIGHT_END;
                    const x = drop.x - drop.dirX * len * (1 - t) + ox;
                    const y = drop.y - drop.dirY * len * (1 - t) + oy;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
            }

            drawRain() {
                const ctx = this.ctx;
                const c = RAIN_CONFIG;
                const levels = this.levels;

                // Bucket the drops by ink density: this is what makes the depth
                // bands read, and it collapses the draw calls.
                for (let l = 0; l < levels; l++) {
                    this.streakBuckets[l].length = 0;
                    this.headBuckets[l].length = 0;
                    this.highlightBuckets[l].length = 0;
                }
                for (let i = 0; i < this.rainDrops.length; i++) {
                    const drop = this.rainDrops[i];
                    this.streakBuckets[drop.level].push(drop);
                    // The drop is one density darker than its own trail, which is
                    // the head-biased fade that real streaks have.
                    this.headBuckets[Math.min(levels - 1, drop.level + 1)].push(drop);
                    if (drop.size >= c.HIGHLIGHT_MIN_SIZE) {
                        this.highlightBuckets[drop.level].push(drop);
                    }
                }

                ctx.clearRect(0, 0, this.width, this.height);

                // 1. Trails
                for (let l = 0; l < levels; l++) {
                    const list = this.streakBuckets[l];
                    if (!list.length) continue;
                    ctx.fillStyle = this.ink(this.levelAlpha(l));
                    ctx.beginPath();
                    for (let i = 0; i < list.length; i++) this.traceStreak(ctx, list[i]);
                    ctx.fill();
                }

                // 2. The drops themselves
                for (let l = 0; l < levels; l++) {
                    const list = this.headBuckets[l];
                    if (!list.length) continue;
                    ctx.fillStyle = this.ink(this.levelAlpha(l));
                    ctx.beginPath();
                    for (let i = 0; i < list.length; i++) {
                        const drop = list[i];
                        const r = this.headHalfWidth(drop);
                        // moveTo first, otherwise arc() joins the previous subpath
                        ctx.moveTo(drop.x + r, drop.y);
                        ctx.arc(drop.x, drop.y, r, 0, TAU);
                    }
                    ctx.fill();
                }

                // 3. Highlights
                ctx.lineCap = 'round';
                for (let l = 0; l < levels; l++) {
                    const list = this.highlightBuckets[l];
                    if (!list.length) continue;
                    ctx.strokeStyle = this.highlightColor(l);
                    ctx.lineWidth = c.HIGHLIGHT_WIDTH * this.sizeForLevel(l);
                    ctx.beginPath();
                    for (let i = 0; i < list.length; i++) this.traceHighlight(ctx, list[i]);
                    ctx.stroke();
                }
            }

            animate(timestamp) {
                if (!this.lastTimestamp) this.lastTimestamp = timestamp;

                let delta = timestamp - this.lastTimestamp;
                this.lastTimestamp = timestamp;
                // A frame after a background tab or a stall can carry seconds of
                // time; clamp it so the shower never jumps.
                if (delta < 0) delta = 0;
                if (delta > 100) delta = 100;

                this.accumulator += delta;

                // Fixed-step simulation, so the fall speed is the same on 60 Hz,
                // 120 Hz and throttled displays.
                let steps = 0;
                while (this.accumulator >= this.timeStep && steps < 6) {
                    const dt = mobileSpeedMultiplier;
                    this.updateRain(dt);
                    this.time += dt;
                    this.accumulator -= this.timeStep;
                    steps++;
                }
                if (steps === 6) this.accumulator = 0;

                if (steps > 0) this.drawRain();

                requestAnimationFrame((ts) => this.animate(ts));
            }
        }

        // Initialize when page loads
        let rainSystem;
        
        window.addEventListener('load', () => {
            rainSystem = new RainSystem();
        });
    </script>
</body>
</html>

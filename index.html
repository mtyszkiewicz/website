<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mtyszkiewicz.dev</title>
    <style>
        /* =====================================================================
           RESET & BASE LAYOUT
           ===================================================================== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #fefefe;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* =====================================================================
           SCENE LAYERS (bottom -> top: ground-plane, canvas, noise-overlay)
           ===================================================================== */

        /* Static horizon and ground wash rendered by the CSS compositor so the
           2D canvas only needs to clear and draw dynamic ink marks each frame. */
        #ground-plane {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* Primary simulation viewport. */
        #canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Subtle animated film grain overlay. */
        #noise-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0.05;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><defs><filter id="noise"><feflood flood-color="white"/><fecomponenttransfer><fefunca type="discrete" tablevalues="0 .5 0 1 0 .8 0 .2 0 .9"/></fecomponenttransfer><fecomposite operator="over" in2="SourceGraphic"/></filter></defs><rect width="100%" height="100%" filter="url(%23noise)"/></svg>') repeat;
            animation: noise 0.2s infinite linear;
        }

        @keyframes noise {
            0%, 100% { transform: translate(0, 0); }
            10%      { transform: translate(-1px, -1px); }
            20%      { transform: translate(1px, 1px); }
            30%      { transform: translate(-1px, 1px); }
            40%      { transform: translate(1px, -1px); }
            50%      { transform: translate(-1px, -1px); }
            60%      { transform: translate(1px, 1px); }
            70%      { transform: translate(-1px, 1px); }
            80%      { transform: translate(1px, -1px); }
            90%      { transform: translate(-1px, -1px); }
        }
    </style>
</head>
<body>
    <div id="ground-plane"></div>
    <canvas id="canvas"></canvas>
    <div id="noise-overlay"></div>

    <script>
        'use strict';

        // =====================================================================
        // SIMULATION CONFIGURATION
        // =====================================================================

        /**
         * Immutable tuning parameters for the perspective rain simulation.
         *
         * Coordinate model:
         * - The viewer stands on a flat ground plane looking slightly downward.
         * - `HORIZON_RATIO` defines the vertical position of the horizon line.
         * - Every drop is assigned a screen-space depth `scale` in [SCALE_MIN, SCALE_MAX],
         *   which determines its landing Y coordinate on the ground plane, its
         *   apparent fall speed, streak thickness, ink density, and splash scale.
         */
        const RAIN_CONFIG = Object.freeze({
            // --- Weather Lulls (unpredictable pauses in the downpour) ---
            LULL_INTERVAL_MIN: 20,     // Seconds until the next lull (random range)
            LULL_INTERVAL_MAX: 25,
            LULL_BLINK_CHANCE: 0.30,   // 30% blink/glitch sequence; the rest (70%) is a full stop
            LULL_DRAIN_MAX: 1.0,       // Seconds allowed for the draining drops to land
            LULL_BLINKS: 16,           // Run/stop pulses per blink sequence
            LULL_BLINK_TOTAL: 0.5,     // Max duration of a whole blink sequence (seconds)
            LULL_RAMP_DURATION: 0.3,   // Seconds to slow into / speed out of the blink
            LULL_RESTART_DELAY: 1.0,   // Seconds of empty sky after the last drop lands
            LULL_RESTART_SPREAD: 1.0,  // Seconds over which returning drops cross the top edge
            LULL_INTRO_FIRST_DELAY: 5, // Opening sequence: first stop after 5 s
            LULL_INTRO_SECOND_DELAY: 10,// ... then the glitch 10 s after rain returns

            // --- Population ---
            DESKTOP_COUNT: 130,
            MOBILE_COUNT: 40,
            SPAWN_MARGIN: 60,          // Horizontal off-screen buffer (px) for wind wrap

            // --- Ground Plane & Horizon ---
            HORIZON_RATIO: 0.62,       // Horizon line as a fraction of viewport height
            HORIZON_HAZE: 0.30,        // Atmospheric fade-in span above the horizon
            GROUND_ALPHA_TOP: 0.040,   // Ground wash opacity right at the horizon
            GROUND_ALPHA_BOTTOM: 0.030,// Ground wash opacity at the bottom edge

            // --- Screen-Space Depth Distribution ---
            SCALE_MIN: 0.06,           // Furthest drops right on the horizon
            SCALE_MAX: 1.80,           // Closest drops right in front of the lens
            DEPTH_BIAS: 1.60,          // > 1 biases population toward the horizon
            NEAR_FRACTION: 0.10,       // Fraction of drops reserved for close foreground

            // --- Fall Kinematics (at scale = 1.0, per 1/60s tick) ---
            FALL_SPEED: 13,
            FALL_SPEED_MIN_SCALE: 0.28,// Floor on speed scale so horizon drops from y=0 don't stall
            FALL_JITTER: 0.18,         // +/-18% per-drop terminal velocity variance

            // --- Motion Blur / Shutter Streak ---
            EXPOSURE: 0.72,            // Streak length = speed * exposure
            LENGTH_JITTER: 0.20,       // +/-20% per-drop streak length variation
            LENGTH_MIN: 3,
            LENGTH_MAX: 34,

            // --- Rectangular Bar Silhouette ---
            HALF_WIDTH_MIN: 0.30,      // Minimum visible bar half-width (px)
            HALF_WIDTH_MAX: 1.15,      // Maximum foreground bar half-width (px)
            WIDTH_EXPONENT: 1.25,      // Non-linear thickness curve across depth

            // --- Wind Field & Turbulence ---
            WIND_BASE: 0.35,           // Prevailing horizontal drift
            WIND_GUST: 1.00,           // Peak gust amplitude
            WIND_FREQUENCY: 0.006,     // Temporal frequency (rad/tick, ~17s cycle)
            WIND_TRAVEL: 0.0025,       // Spatial wave number (rad/px across viewport)
            WIND_RESPONSE: 0.10,       // Horizontal velocity smoothing factor per tick
            SLANT_JITTER: 0.10,        // Per-drop angle variance
            WOBBLE_STRENGTH: 0.10,     // High-frequency oscillation amplitude
            WOBBLE_SPEED_MIN: 0.02,    // Oscillation speed range (rad/tick)
            WOBBLE_SPEED_MAX: 0.05,

            // --- Ink Posterisation & Palette ---
            INK_LEVELS: 6,             // Discrete depth-of-field ink buckets for batching
            FAR_ALPHA: 0.24,           // Ink opacity at level 0 (horizon)
            NEAR_ALPHA: 0.78,          // Ink opacity at highest level (foreground)
            COLOR_R: 0,
            COLOR_G: 0,
            COLOR_B: 0,

            // --- Ground Impact Splashes ---
            SPLASH_STAGES: 4,          // Quantised fade stages per ink level for batching
            SPLASH_LIFE_MIN: 18,       // Splash duration range (ticks)
            SPLASH_LIFE_MAX: 30,
            SPLASH_RADIUS: 16,         // Base ring radius (px) at scale = 1.0
            SPLASH_RADIUS_MIN: 3.6,    // Minimum ring radius so distant impacts remain legible
            SPLASH_FLAT_FAR: 0.34,     // Ellipse aspect ratio (ry/rx) near horizon
            SPLASH_FLAT_NEAR: 0.48,    // Ellipse aspect ratio (ry/rx) near bottom of frame
            SPLASH_ALPHA: 0.55,        // Opacity multiplier relative to level ink
            SPLASH_WIDTH: 1.30,        // Ring stroke width at scale = 1.0
            SPLASH_BEADS_MIN: 1,       // Crown droplet count range per impact
            SPLASH_BEADS_MAX: 3,
            SPLASH_BEAD_SPEED: 3.0,    // Crown droplet upward launch speed at scale = 1.0
            SPLASH_BEAD_GRAVITY: 0.26, // Crown droplet gravity per tick at scale = 1.0
            MAX_SPLASHES: 400,         // Hard cap on concurrent active splashes

            // --- Specular Highlight ---
            HIGHLIGHT_R: 128,
            HIGHLIGHT_G: 128,
            HIGHLIGHT_B: 128,
            HIGHLIGHT_ALPHA: 0.38,
            HIGHLIGHT_WIDTH: 0.45,          // Stroke width as a fraction of bar half-width
            HIGHLIGHT_OFFSET: 0.38,         // Lateral offset toward the lit (left) edge
            HIGHLIGHT_START: 0.18,          // Start position along bar (0 = tail, 1 = head)
            HIGHLIGHT_END: 0.92,            // End position along bar
            HIGHLIGHT_MIN_HALF_WIDTH: 0.65, // Minimum bar half-width required to render highlight
        });

        /**
         * Mobile-specific overrides applied on narrow/handheld viewports so
         * rectangular rain bars and ground splashes are proportionally scaled.
         */
        const MOBILE_RAIN_OVERRIDES = Object.freeze({
            SPAWN_MARGIN: 36,
            NEAR_FRACTION: 0.06,
            EXPOSURE: 0.85,
            LENGTH_MIN: 4,
            LENGTH_MAX: 28,
            HALF_WIDTH_MIN: 0.24,
            HALF_WIDTH_MAX: 0.85,
            SPLASH_RADIUS: 9.5,
            SPLASH_RADIUS_MIN: 2.2,
            SPLASH_WIDTH: 0.85,
            SPLASH_BEAD_SPEED: 2.1,
            HIGHLIGHT_ALPHA: 0.28,
            HIGHLIGHT_WIDTH: 0.40,
            HIGHLIGHT_OFFSET: 0.34,
            HIGHLIGHT_MIN_HALF_WIDTH: 0.50,
        });

        // =====================================================================
        // CONSTANTS & MATH UTILITIES
        // =====================================================================

        const TAU = Math.PI * 2;
        const TICK_MS = 1000 / 60;
        const TICKS_PER_SECOND = 1000 / TICK_MS;
        const PREROLL_TICKS = 90;
        const MOBILE_BREAKPOINT = 768;
        const MOBILE_UA_REGEX = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i;

        /** Clamps `value` to the inclusive range `[min, max]`. */
        function clamp(value, min, max) {
            if (value < min) return min;
            if (value > max) return max;
            return value;
        }

        /** Linearly interpolates between `a` and `b` by factor `t`. */
        function mix(a, b, t) {
            return a + (b - a) * t;
        }

        /** Formats an RGBA CSS color string. */
        function rgba(r, g, b, alpha) {
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // =====================================================================
        // PRECOMPUTED STYLE LOOKUP TABLES
        // =====================================================================

        /**
         * Precomputes per-level and per-splash-bucket rendering descriptors
         * (fill/stroke CSS strings, stroke widths, growth multipliers) so the
         * render loop performs zero string allocations.
         */
        function buildRenderTables(config) {
            const levels = config.INK_LEVELS;
            const stages = config.SPLASH_STAGES;

            const levelInkStyle = [];
            const levelHighlightStyle = [];
            const levelHighlightWidth = new Float64Array(levels);

            for (let level = 0; level < levels; level++) {
                const l = levels > 1 ? level / (levels - 1) : 1;
                const inkAlpha = mix(config.FAR_ALPHA, config.NEAR_ALPHA, l);
                const highlightAlpha = config.HIGHLIGHT_ALPHA * mix(0.55, 1, l);
                const halfWidth = mix(
                    config.HALF_WIDTH_MIN,
                    config.HALF_WIDTH_MAX,
                    Math.pow(l, config.WIDTH_EXPONENT)
                );

                levelInkStyle[level] = rgba(config.COLOR_R, config.COLOR_G, config.COLOR_B, inkAlpha);
                levelHighlightStyle[level] = rgba(
                    config.HIGHLIGHT_R,
                    config.HIGHLIGHT_G,
                    config.HIGHLIGHT_B,
                    highlightAlpha
                );
                levelHighlightWidth[level] = clamp(config.HIGHLIGHT_WIDTH * halfWidth, 0.3, 1.8);
            }

            const totalSplashBuckets = levels * stages;
            const splashBucketStyles = [];

            for (let b = 0; b < totalSplashBuckets; b++) {
                const level = Math.floor(b / stages);
                const l = levels > 1 ? level / (levels - 1) : 1;
                const p = ((b % stages) + 0.5) / stages;
                const scale = mix(config.SCALE_MIN, config.SCALE_MAX, l);

                const alpha = mix(0.55, 0.95, l) * config.SPLASH_ALPHA * Math.pow(1 - p, 1.6);
                const grow = 1 - Math.pow(1 - p, 2.4);

                splashBucketStyles[b] = {
                    grow,
                    ringScale: 0.25 + 0.75 * grow,
                    lineWidth: clamp(config.SPLASH_WIDTH * scale, 0.4, 2.4),
                    splatFillStyle: rgba(config.COLOR_R, config.COLOR_G, config.COLOR_B, alpha * 0.55),
                    ringStrokeStyle: rgba(config.COLOR_R, config.COLOR_G, config.COLOR_B, alpha),
                    beadFillStyle: rgba(config.COLOR_R, config.COLOR_G, config.COLOR_B, alpha * 0.9),
                };
            }

            return {
                levelInkStyle,
                levelHighlightStyle,
                levelHighlightWidth,
                splashBucketStyles,
            };
        }

        // =====================================================================
        // RAIN SIMULATION ENGINE
        // =====================================================================

        class RainSystem {
            constructor(baseConfig = RAIN_CONFIG) {
                this.baseConfig = baseConfig;
                this.canvas = document.querySelector('#canvas');
                this.ctx = this.canvas.getContext('2d');
                this.groundPlane = document.querySelector('#ground-plane');

                // Environment capabilities & accessibility preferences
                this.isMobile =
                    MOBILE_UA_REGEX.test(navigator.userAgent) ||
                    window.innerWidth < MOBILE_BREAKPOINT;
                this.config = this.isMobile
                    ? Object.freeze({ ...baseConfig, ...MOBILE_RAIN_OVERRIDES })
                    : baseConfig;
                this.speedMultiplier = 1.0;
                this.prefersReducedMotion = window.matchMedia(
                    '(prefers-reduced-motion: reduce)'
                ).matches;

                // Simulation state
                this.drops = [];
                this.splashes = [];
                this.time = 0;
                this.lastTimestamp = 0;
                this.width = 0;
                this.height = 0;
                this.horizon = 0;
                this.groundSpan = 1;

                // Precomputed lookup tables
                this.styles = buildRenderTables(this.config);

                // Reusable render batch buckets (indexed by ink level / splash stage)
                this.levels = this.config.INK_LEVELS;
                this.splashStages = this.config.SPLASH_STAGES;
                this.streakBuckets = Array.from({ length: this.levels }, () => []);
                this.highlightBuckets = Array.from({ length: this.levels }, () => []);
                this.splashBuckets = Array.from(
                    { length: this.levels * this.splashStages },
                    () => []
                );

                /* Weather-lull state machine:
                   'rain'     - normal shower, counting down to the next lull
                   'freeze'   - physics suspended; the scene hangs in place
                   'rampDown' - 0.3 s ease from full speed into the blink
                   'rampUp'   - 0.3 s ease from the blink back to full speed
                   'drain'    - no respawns; drops fall, land, and are removed
                   'gap'      - empty sky for LULL_RESTART_DELAY, then reseed
                   `timer` and `elapsed` are expressed in 1/60 s ticks. */
                this.blinksRemaining = 0;
                this.blinkSequenceActive = false;
                // Each blink burns one run phase and one stop phase, so split
                // the total budget evenly across both.
                this.blinkPhaseTicks =
                    (this.config.LULL_BLINK_TOTAL / (this.config.LULL_BLINKS * 2)) * TICKS_PER_SECOND;
                this.blinkRampTicks = this.config.LULL_RAMP_DURATION * TICKS_PER_SECOND;
                // Opening script: 0 = pending stop, 1 = pending glitch, 2 = glitch
                // running, 3 = normal random loop.
                this.introStep = 0;
                this.lull = {
                    mode: 'rain',
                    timer: this.config.LULL_INTRO_FIRST_DELAY * TICKS_PER_SECOND,
                    elapsed: 0,
                };

                // Bound callbacks
                this.handleResize = () => this.resize();
                this.handleFrame = (ts) => this.animate(ts);

                // Setup viewport, populate drops, and pre-roll into steady state
                this.resize();
                this.initDrops();
                this.preroll(PREROLL_TICKS);
                this.drawRain();

                if (!this.prefersReducedMotion) {
                    requestAnimationFrame(this.handleFrame);
                }

                window.addEventListener('resize', this.handleResize);
            }

            // -----------------------------------------------------------------
            // Viewport & Scene Setup
            // -----------------------------------------------------------------

            /**
             * Synchronises canvas backing resolution, CSS horizon gradient,
             * and perspective projection metrics with the current window size.
             */
            resize() {
                const nextIsMobile =
                    MOBILE_UA_REGEX.test(navigator.userAgent) ||
                    window.innerWidth < MOBILE_BREAKPOINT;
                const tierChanged = nextIsMobile !== this.isMobile;
                if (tierChanged) {
                    this.isMobile = nextIsMobile;
                    this.config = this.isMobile
                        ? Object.freeze({ ...this.baseConfig, ...MOBILE_RAIN_OVERRIDES })
                        : this.baseConfig;
                    this.styles = buildRenderTables(this.config);
                }

                const c = this.config;
                const dpr = Math.min(window.devicePixelRatio || 1, 2);

                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = Math.round(this.width * dpr);
                this.canvas.height = Math.round(this.height * dpr);

                // Maintain CSS pixel coordinates while rendering at native DPR sharpness
                this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                this.horizon = this.height * c.HORIZON_RATIO;
                this.groundSpan = Math.max(1, this.height - this.horizon);

                const hazeRatio = c.HORIZON_RATIO - (1 - c.HORIZON_RATIO) * c.HORIZON_HAZE;
                this.groundPlane.style.background =
                    'linear-gradient(to bottom,' +
                    ` rgba(0, 0, 0, 0) ${(hazeRatio * 100).toFixed(2)}%,` +
                    ` rgba(0, 0, 0, ${c.GROUND_ALPHA_TOP}) ${(c.HORIZON_RATIO * 100).toFixed(2)}%,` +
                    ` rgba(0, 0, 0, ${c.GROUND_ALPHA_BOTTOM}) 100%)`;

                if (this.drops.length > 0) {
                    if (tierChanged && this.lull.mode !== 'gap' && this.lull.mode !== 'drain') {
                        this.splashes.length = 0;
                        this.initDrops(true);
                    } else {
                        for (let i = 0; i < this.drops.length; i++) {
                            const drop = this.drops[i];
                            drop.landY = this.horizon + drop.scale * this.groundSpan;
                        }
                    }
                    this.drawRain();
                }
            }

            /** Populates the raindrop pool according to device tier. */
            initDrops(initial = true, entranceSpreadTicks = 0) {
                const count = this.isMobile
                    ? this.config.MOBILE_COUNT
                    : this.config.DESKTOP_COUNT;

                this.drops.length = 0;
                for (let i = 0; i < count; i++) {
                    const drop = {};
                    // Stratified entry times keep the returning stream even:
                    // one drop every spread/count ticks instead of clumps.
                    this.seedDrop(
                        drop,
                        initial,
                        entranceSpreadTicks,
                        (i + Math.random()) / count
                    );
                    this.drops.push(drop);
                }
            }

            /** Advances the simulation off-screen so frame 0 renders a settled shower. */
            preroll(ticks) {
                for (let i = 0; i < ticks; i++) {
                    this.updateRain(1);
                    this.time += 1;
                }
            }

            // -----------------------------------------------------------------
            // Weather Lulls
            // -----------------------------------------------------------------

            /** Picks a random delay (in ticks) before the next lull. */
            randomLullInterval() {
                const c = this.config;
                return mix(c.LULL_INTERVAL_MIN, c.LULL_INTERVAL_MAX, Math.random()) * TICKS_PER_SECOND;
            }

            /** Delay before the next lull, shortened while a blink sequence runs. */
            currentLullInterval() {
                if (this.blinksRemaining > 0) {
                    return this.blinkPhaseTicks;
                }
                return this.randomLullInterval();
            }

            /** Begins a blink sequence with its slow-in / slow-out ramps. */
            startBlinkSequence() {
                this.blinkSequenceActive = true;
                this.blinksRemaining = this.config.LULL_BLINKS;
                this.lull.mode = 'rampDown';
                this.lull.elapsed = 0;
            }

            /**
             * Chooses the next lull type:
             * - 30% blink sequence (ramp down, 16 run/stop pulses, ramp up)
             * - 70% drain-out (rain stops, then restarts after a gap)
             */
            beginLull() {
                const c = this.config;

                // Mid-sequence: emit the next freeze pulse.
                if (this.blinksRemaining > 0) {
                    this.blinksRemaining--;
                    this.lull.mode = 'freeze';
                    this.lull.timer = this.blinkPhaseTicks;
                    return;
                }

                // Scripted opening: first a stop, then a glitch, then the loop.
                if (this.introStep === 0) {
                    this.introStep = 1;
                    this.startDrain();
                    return;
                }
                if (this.introStep === 1) {
                    this.introStep = 2;
                    this.startBlinkSequence();
                    return;
                }

                const roll = Math.random();
                if (roll < c.LULL_BLINK_CHANCE) {
                    this.startBlinkSequence();
                } else {
                    this.startDrain();
                }
            }

            /** Begins a drain and forces every remaining drop to land within LULL_DRAIN_MAX. */
            startDrain() {
                const c = this.config;
                const maxTicks = c.LULL_DRAIN_MAX * TICKS_PER_SECOND;
                this.lull.mode = 'drain';
                this.lull.timer = 0;

                for (let i = 0; i < this.drops.length; i++) {
                    const drop = this.drops[i];
                    const distance = drop.landY - drop.y;
                    if (distance <= 0) continue;
                    const requiredSpeed = distance / maxTicks;
                    if (drop.vy < requiredSpeed) {
                        // Only slow, distant drops are nudged; near drops land naturally.
                        drop.vy = requiredSpeed;
                        // Keep the motion-blur streak consistent with the new speed.
                        drop.length = clamp(
                            drop.vy * c.EXPOSURE * drop.jitter,
                            c.LENGTH_MIN,
                            c.LENGTH_MAX
                        );
                    }
                }
            }

            /**
             * Advances the weather-lull state machine.
             *
             * @returns {number} Simulation speed factor for this tick (0 = frozen, 1 = base).
             */
            updateLull(dt) {
                const lull = this.lull;

                switch (lull.mode) {
                    case 'rain':
                        lull.timer -= dt;
                        if (lull.timer <= 0) this.beginLull();
                        return 1;

                    case 'rampDown': {
                        lull.elapsed += dt;
                        const progress = clamp(lull.elapsed / this.blinkRampTicks, 0, 1);
                        if (progress >= 1) {
                            // Fully slowed: begin the first freeze pulse.
                            this.beginLull();
                            return 0;
                        }
                        return 1 - progress;
                    }

                    case 'rampUp': {
                        lull.elapsed += dt;
                        const progress = clamp(lull.elapsed / this.blinkRampTicks, 0, 1);
                        if (progress >= 1) {
                            this.blinkSequenceActive = false;
                            if (this.introStep === 2) this.introStep = 3;
                            lull.mode = 'rain';
                            lull.timer = this.randomLullInterval();
                            return 1;
                        }
                        return progress;
                    }

                    case 'freeze':
                        // Suspend physics and time so the shower hangs still.
                        lull.timer -= dt;
                        if (lull.timer <= 0) {
                            if (this.blinkSequenceActive) {
                                if (this.blinksRemaining > 0) {
                                    // Run phase between two pulses.
                                    lull.mode = 'rain';
                                    lull.timer = this.blinkPhaseTicks;
                                } else {
                                    // Last pulse done: ease back to base speed.
                                    lull.mode = 'rampUp';
                                    lull.elapsed = 0;
                                }
                            } else {
                                lull.mode = 'rain';
                                lull.timer = this.randomLullInterval();
                            }
                        }
                        return 0;

                    case 'drain':
                        // updateRain() removes drops on impact and flips to 'gap'.
                        return 1;

                    case 'gap':
                        lull.timer -= dt;
                        if (lull.timer <= 0) {
                            /* Rebuild the shower above the top edge. The entrance
                               spread keeps all drops from crossing the top line
                               in one solid wave; the first ones cross immediately. */
                            this.initDrops(
                                false,
                                this.config.LULL_RESTART_SPREAD * TICKS_PER_SECOND
                            );
                            lull.mode = 'rain';
                            lull.timer = this.introStep === 1
                                ? this.config.LULL_INTRO_SECOND_DELAY * TICKS_PER_SECOND
                                : this.currentLullInterval();
                        }
                        return 1;
                }

                return 1;
            }

            // -----------------------------------------------------------------
            // Depth & Weather Helpers
            // -----------------------------------------------------------------

            /** Maps a drop's `scale` into normalised depth `[0, 1]`. */
            scaleToNorm(scale) {
                const c = this.config;
                return clamp((scale - c.SCALE_MIN) / (c.SCALE_MAX - c.SCALE_MIN), 0, 1);
            }

            /** Maps normalised depth `[0, 1]` to a discrete ink bucket index. */
            levelForNorm(norm) {
                return Math.round(clamp(norm, 0, 1) * (this.levels - 1));
            }

            /**
             * Evaluates the shared horizontal wind velocity at screen coordinate `x`.
             * Combines a primary low-frequency wave with a secondary harmonic so
             * gusts roll smoothly across the viewport.
             */
            windAt(x) {
                const c = this.config;
                const phase = this.time * c.WIND_FREQUENCY - x * c.WIND_TRAVEL;
                const gustWave = Math.sin(phase) * 0.72 + Math.sin(phase * 2.3 + 1.7) * 0.28;
                return c.WIND_BASE + c.WIND_GUST * gustWave;
            }

            // -----------------------------------------------------------------
            // Drop Lifecycle & Physics Update
            // -----------------------------------------------------------------

            /**
             * Assigns a drop's depth, landing point, appearance, and initial
             * kinematics. Called on initial creation and recycled after impact.
             *
             * @param {Object}  drop                Target drop state object to mutate in place.
             * @param {boolean} initial             When true, scatters `y` along the full fall column.
             * @param {number}  entranceSpreadTicks Entry-time spread (ticks) for a fresh shower.
             * @param {number}  spreadFraction      Position of this drop inside the entry window.
             */
            seedDrop(drop, initial, entranceSpreadTicks = 0, spreadFraction = Math.random()) {
                const c = this.config;

                // Assign depth once per drop slot so faster foreground recycling
                // never skews the steady-state depth distribution toward the horizon.
                if (initial || drop.scale === undefined) {
                    const depth = Math.random() < c.NEAR_FRACTION
                        ? mix(0.55, 1, Math.random())
                        : Math.pow(Math.random(), c.DEPTH_BIAS);
                    drop.scale = mix(c.SCALE_MIN, c.SCALE_MAX, depth);
                    drop.norm = this.scaleToNorm(drop.scale);
                    drop.halfWidth = mix(
                        c.HALF_WIDTH_MIN,
                        c.HALF_WIDTH_MAX,
                        Math.pow(drop.norm, c.WIDTH_EXPONENT)
                    );
                    drop.level = this.levelForNorm(drop.norm);
                }

                drop.landY = this.horizon + drop.scale * this.groundSpan;
                drop.x = Math.random() * (this.width + c.SPAWN_MARGIN * 2) - c.SPAWN_MARGIN;

                // Per-drop physical character (fixed for the lifetime of this fall)
                drop.slant = (Math.random() - 0.5) * c.SLANT_JITTER;
                drop.wobble = Math.random() * TAU;
                drop.wobbleSpeed = mix(c.WOBBLE_SPEED_MIN, c.WOBBLE_SPEED_MAX, Math.random());
                drop.jitter = 1 + (Math.random() - 0.5) * 2 * c.LENGTH_JITTER;

                // Kinematics scaled by perspective depth; streak length reflects true
                // depth scale while fall velocity keeps a floor so top-of-screen
                // horizon drops traverse the sky in reasonable time.
                const velocityJitter = 1 + (Math.random() - 0.5) * 2 * c.FALL_JITTER;
                const streakSpeed = c.FALL_SPEED * drop.scale * velocityJitter;
                const speedScale = Math.max(drop.scale, c.FALL_SPEED_MIN_SCALE);
                drop.speed = c.FALL_SPEED * speedScale * velocityJitter;
                drop.vy = drop.speed;
                drop.vx = 0;
                drop.dirX = 0;
                drop.dirY = 1;
                drop.length = clamp(streakSpeed * c.EXPOSURE * drop.jitter, c.LENGTH_MIN, c.LENGTH_MAX);

                // Start above the top edge. The initial pass is scattered along
                // each column; a restart offsets each drop by a random fraction
                // of its own speed so entries are staggered instead of forming
                // one solid layer, while some cross the line on the first frame.
                const spawnTopY = -drop.halfWidth - Math.random() * c.SPAWN_MARGIN;
                if (initial) {
                    drop.y = mix(spawnTopY, drop.landY, Math.random());
                } else {
                    const spread = entranceSpreadTicks > 0
                        ? spreadFraction * drop.speed * entranceSpreadTicks
                        : 0;
                    drop.y = -drop.halfWidth - spread;
                }
            }

            /** Advances all active raindrops and splashes by `dt` (in 1/60s ticks). */
            updateRain(dt) {
                const c = this.config;
                const isDraining = this.lull.mode === 'drain';

                for (let i = 0; i < this.drops.length; i++) {
                    const drop = this.drops[i];

                    // During a drain-out, discard any drop still above the
                    // viewport so no new drops enter from the top edge.
                    if (isDraining && drop.y + drop.halfWidth <= 0) {
                        const last = this.drops.pop();
                        if (i < this.drops.length) this.drops[i] = last;
                        i--;
                        continue;
                    }

                    const windLerp = clamp(c.WIND_RESPONSE * dt, 0, 1);

                    // Horizontal velocity relaxes toward the local wind + turbulence
                    const targetVx = (
                        this.windAt(drop.x) +
                        drop.slant +
                        Math.sin(drop.wobble) * c.WOBBLE_STRENGTH
                    ) * drop.scale;
                    drop.vx += (targetVx - drop.vx) * windLerp;

                    drop.wobble += drop.wobbleSpeed * dt;
                    drop.x += drop.vx * dt;
                    drop.y += drop.vy * dt;

                    // Align streak vector with instantaneous velocity
                    const invSpeed = 1 / Math.hypot(drop.vx, drop.vy);
                    drop.dirX = drop.vx * invSpeed;
                    drop.dirY = drop.vy * invSpeed;

                    // Ground plane impact check
                    if (drop.y >= drop.landY) {
                        this.spawnSplash(drop);

                        if (isDraining) {
                            /* During a drain-out no fresh drop replaces this one:
                               remove it in place and keep the loop on the same
                               index, so the array shrinks as the sky empties. */
                            const last = this.drops.pop();
                            if (i < this.drops.length) this.drops[i] = last;
                            i--;
                        } else {
                            this.seedDrop(drop, false);
                        }
                        continue;
                    }

                    // Horizontal toroidal wrap so wind-driven drops stay within the field
                    const margin = drop.length + c.SPAWN_MARGIN;
                    const span = this.width + margin * 2;
                    if (drop.x > this.width + margin) {
                        drop.x -= span;
                    } else if (drop.x < -margin) {
                        drop.x += span;
                    }
                }

                this.updateSplashes(dt);

                // Every draining drop has landed: hold an empty sky for 1 s.
                if (isDraining && this.drops.length === 0) this.startGap();
            }

            /** Clears the field and starts the empty-sky pause. */
            startGap() {
                this.drops.length = 0;
                // The downpour is over: no lingering impact rings during the pause.
                this.splashes.length = 0;
                this.lull.mode = 'gap';
                this.lull.timer = this.config.LULL_RESTART_DELAY * TICKS_PER_SECOND;
            }

            /**
             * Spawns a ground splash ring and crown droplets at a drop's landing site.
             */
            spawnSplash(drop) {
                const c = this.config;

                if (drop.landY > this.height + 6 || this.splashes.length >= c.MAX_SPLASHES) {
                    return;
                }

                const splash = {
                    x: drop.x,
                    y: drop.landY,
                    scale: drop.scale,
                    level: drop.level,
                    radius: Math.max(
                        c.SPLASH_RADIUS_MIN,
                        c.SPLASH_RADIUS * drop.scale * mix(0.65, 1.35, Math.random())
                    ),
                    flat: mix(c.SPLASH_FLAT_FAR, c.SPLASH_FLAT_NEAR, drop.norm),
                    age: 0,
                    life: Math.max(6, mix(c.SPLASH_LIFE_MIN, c.SPLASH_LIFE_MAX, Math.random())),
                    beads: null,
                };

                const beadCount =
                    c.SPLASH_BEADS_MIN +
                    Math.floor(Math.random() * (c.SPLASH_BEADS_MAX - c.SPLASH_BEADS_MIN + 1));

                if (beadCount > 0) {
                    splash.beads = [];
                    for (let i = 0; i < beadCount; i++) {
                        splash.beads.push({
                            x: 0,
                            y: 0,
                            vx: (Math.random() - 0.5) * 2.4 * drop.scale,
                            vy: -(0.45 + Math.random() * 0.75) * c.SPLASH_BEAD_SPEED * drop.scale,
                        });
                    }
                }

                this.splashes.push(splash);
            }

            /**
             * Advances splash timers and crown droplet ballistic trajectories,
             * compacting expired splashes in-place without array reallocation.
             */
            updateSplashes(dt) {
                const gravityBase = this.config.SPLASH_BEAD_GRAVITY;
                const splashes = this.splashes;
                let writeIndex = 0;

                for (let i = 0; i < splashes.length; i++) {
                    const splash = splashes[i];
                    splash.age += dt;
                    if (splash.age >= splash.life) continue;

                    if (splash.beads) {
                        const gravity = gravityBase * splash.scale;
                        for (let j = 0; j < splash.beads.length; j++) {
                            const bead = splash.beads[j];
                            bead.vy += gravity * dt;
                            bead.x += bead.vx * dt;
                            bead.y += bead.vy * dt;
                        }
                    }

                    splashes[writeIndex++] = splash;
                }

                splashes.length = writeIndex;
            }

            // -----------------------------------------------------------------
            // Canvas Path Tracing & Batched Rendering
            // -----------------------------------------------------------------

            /**
             * Appends a single drop's uniform-width rectangular bar along its
             * instantaneous fall vector to the current canvas path.
             */
            traceStreak(ctx, drop) {
                const len = drop.length;
                const dirX = drop.dirX;
                const dirY = drop.dirY;
                const wx = -dirY * drop.halfWidth;
                const wy = dirX * drop.halfWidth;
                const tailX = drop.x - dirX * len;
                const tailY = drop.y - dirY * len;

                ctx.moveTo(tailX + wx, tailY + wy);
                ctx.lineTo(drop.x + wx, drop.y + wy);
                ctx.lineTo(drop.x - wx, drop.y - wy);
                ctx.lineTo(tailX - wx, tailY - wy);
                ctx.closePath();
            }

            /**
             * Appends a drop's off-centre specular highlight line segment
             * to the current canvas path.
             */
            traceHighlight(ctx, drop) {
                const c = this.config;
                const len = drop.length;
                const offset = drop.halfWidth * c.HIGHLIGHT_OFFSET;
                const ox = -drop.dirY * offset;
                const oy = drop.dirX * offset;

                const startDist = len * (1 - c.HIGHLIGHT_START);
                const endDist = len * (1 - c.HIGHLIGHT_END);

                ctx.moveTo(drop.x - drop.dirX * startDist + ox, drop.y - drop.dirY * startDist + oy);
                ctx.lineTo(drop.x - drop.dirX * endDist + ox, drop.y - drop.dirY * endDist + oy);
            }

            /**
             * Renders all active ground splashes batched by (inkLevel, fadeStage).
             * Each bucket issues at most three draw calls: wet splat fill,
             * expanding ripple stroke, and airborne crown droplet fill.
             */
            drawSplashes() {
                const ctx = this.ctx;
                const stages = this.splashStages;
                const buckets = this.splashBuckets;
                const bucketStyles = this.styles.splashBucketStyles;

                for (let i = 0; i < buckets.length; i++) {
                    buckets[i].length = 0;
                }

                for (let i = 0; i < this.splashes.length; i++) {
                    const splash = this.splashes[i];
                    const progress = clamp(splash.age / splash.life, 0, 0.9999);
                    const bucketIdx = splash.level * stages + Math.floor(progress * stages);
                    buckets[bucketIdx].push(splash);
                }

                ctx.lineCap = 'round';

                for (let b = 0; b < buckets.length; b++) {
                    const list = buckets[b];
                    if (list.length === 0) continue;

                    const style = bucketStyles[b];
                    const grow = style.grow;
                    const ringScale = style.ringScale;

                    // 1. Inner wet splat mark
                    ctx.fillStyle = style.splatFillStyle;
                    ctx.beginPath();
                    for (let i = 0; i < list.length; i++) {
                        const splash = list[i];
                        const rx = Math.max(0.5, splash.radius * grow);
                        const ry = Math.max(0.3, rx * splash.flat);
                        ctx.moveTo(splash.x + rx, splash.y);
                        ctx.ellipse(splash.x, splash.y, rx, ry, 0, 0, TAU);
                    }
                    ctx.fill();

                    // 2. Expanding elliptical ripple ring
                    ctx.strokeStyle = style.ringStrokeStyle;
                    ctx.lineWidth = style.lineWidth;
                    ctx.beginPath();
                    for (let i = 0; i < list.length; i++) {
                        const splash = list[i];
                        const rx = Math.max(0.4, splash.radius * ringScale);
                        const ry = Math.max(0.25, rx * splash.flat);
                        ctx.moveTo(splash.x + rx, splash.y);
                        ctx.ellipse(splash.x, splash.y, rx, ry, 0, 0, TAU);
                    }
                    ctx.stroke();

                    // 3. Airborne crown droplets
                    ctx.fillStyle = style.beadFillStyle;
                    let hasAirborneBeads = false;
                    ctx.beginPath();
                    for (let i = 0; i < list.length; i++) {
                        const splash = list[i];
                        if (!splash.beads) continue;
                        const r = Math.max(0.3, 0.85 * splash.scale);
                        for (let j = 0; j < splash.beads.length; j++) {
                            const bead = splash.beads[j];
                            if (bead.y > 0) continue; // Below ground plane
                            const bx = splash.x + bead.x;
                            const by = splash.y + bead.y;
                            ctx.moveTo(bx + r, by);
                            ctx.arc(bx, by, r, 0, TAU);
                            hasAirborneBeads = true;
                        }
                    }
                    if (hasAirborneBeads) {
                        ctx.fill();
                    }
                }
            }

            /**
             * Clears the canvas and renders the full rain scene in back-to-front
             * order, batching geometry by quantized ink density level.
             */
            drawRain() {
                const ctx = this.ctx;
                const c = this.config;
                const levels = this.levels;
                const { levelInkStyle, levelHighlightStyle, levelHighlightWidth } = this.styles;

                // Clear per-level batch queues
                for (let l = 0; l < levels; l++) {
                    this.streakBuckets[l].length = 0;
                    this.highlightBuckets[l].length = 0;
                }

                // Partition drops into depth-of-field ink buckets
                for (let i = 0; i < this.drops.length; i++) {
                    const drop = this.drops[i];
                    if (drop.y + drop.halfWidth <= 0) continue;
                    this.streakBuckets[drop.level].push(drop);
                    if (drop.halfWidth >= c.HIGHLIGHT_MIN_HALF_WIDTH) {
                        this.highlightBuckets[drop.level].push(drop);
                    }
                }

                ctx.clearRect(0, 0, this.width, this.height);

                // Pass 1: Ground splashes (underneath falling drops)
                this.drawSplashes();

                // Pass 2: Uniform rectangular rain bars
                for (let l = 0; l < levels; l++) {
                    const list = this.streakBuckets[l];
                    if (list.length === 0) continue;
                    ctx.fillStyle = levelInkStyle[l];
                    ctx.beginPath();
                    for (let i = 0; i < list.length; i++) {
                        this.traceStreak(ctx, list[i]);
                    }
                    ctx.fill();
                }

                // Pass 3: Flat-ended specular highlights on foreground bars
                ctx.lineCap = 'butt';
                for (let l = 0; l < levels; l++) {
                    const list = this.highlightBuckets[l];
                    if (list.length === 0) continue;
                    ctx.strokeStyle = levelHighlightStyle[l];
                    ctx.lineWidth = levelHighlightWidth[l];
                    ctx.beginPath();
                    for (let i = 0; i < list.length; i++) {
                        this.traceHighlight(ctx, list[i]);
                    }
                    ctx.stroke();
                }
            }

            // -----------------------------------------------------------------
            // Main Animation Loop
            // -----------------------------------------------------------------

            /**
             * Variable-timestep `requestAnimationFrame` callback. Clamps large
             * frame deltas (e.g., after background tab suspension) so the
             * simulation never jumps.
             */
            animate(timestamp) {
                if (!this.lastTimestamp) {
                    this.lastTimestamp = timestamp;
                }

                const rawDelta = timestamp - this.lastTimestamp;
                this.lastTimestamp = timestamp;

                const delta = clamp(rawDelta, 0, 100);
                const dt = clamp(delta / TICK_MS, 0, 3) * this.speedMultiplier;

                if (dt > 0) {
                    // `speed` is 0 while frozen and eases through the blink ramps.
                    const speed = this.updateLull(dt);
                    if (speed > 0) {
                        const scaledDt = dt * speed;
                        this.updateRain(scaledDt);
                        this.time += scaledDt;
                    }
                }

                this.drawRain();
                requestAnimationFrame(this.handleFrame);
            }
        }

        // =====================================================================
        // BOOTSTRAP
        // =====================================================================

        window.addEventListener('load', () => {
            new RainSystem();
        });
    </script>
</body>
